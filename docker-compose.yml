version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16 # Uses Postgres 16 with pgvector pre-installed
    restart: always
    ports:
      - "${DB_PORT}:5432"
    env_file:
      - .app_env
      - .docker-env
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  web:
    build: .
    platform: linux/amd64
    env_file:
      - .docker-env
    volumes:
      - .:/usr/src/app
    ports:
      - "${WEB_PORT}:8000"
    depends_on:
      - db

